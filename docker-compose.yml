name: car-dealership-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: car-dealership-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_dealership_dev}
      POSTGRES_USER: ${POSTGRES_USER:-car_dealership_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in the local .env file}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - car_dealership_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-car_dealership_dev} -d ${POSTGRES_DB:-car_dealership_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  car_dealership_dev_pgdata:
    name: car_dealership_dev_pgdata
